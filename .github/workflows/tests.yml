name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install R comparator test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core r-cran-class
      - run: make setup
      - run: make test verify-provenance paper-figures
